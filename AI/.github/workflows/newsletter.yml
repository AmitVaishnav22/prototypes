name: Send Update Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger backend
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg commit "$GITHUB_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            '{repository: $repository, branch: $branch, commit: $commit, message: $message}')

          signature="sha256=$(printf '%s' "$payload" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r \
            | cut -d' ' -f1)"

          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/newsletter/github-release" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $GITHUB_SHA" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload"